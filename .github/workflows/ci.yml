name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check dependencies
        run: go mod tidy -diff
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: CGO_ENABLED=0 go build -ldflags "-X main.version=${{ github.sha }}" -o james .

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      # A pull request builds the image but pushes nothing, so a Dockerfile
      # that stopped working is a failed check instead of a failed publish.
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A plain manifest without attestations, because a deployment that
          # follows latest compares digests to decide it has something new.
          provenance: false
          sbom: false

  watchtower:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # A deployment that follows latest is told to pull, rather than left to
      # find out on its next poll. A checkout without the two settings, a fork
      # for example, has nothing to notify and says so.
      - name: Ask watchtower to pull the new image
        env:
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
        run: |
          set -eu
          if [ -z "${WATCHTOWER_URL:-}" ]; then
            echo 'No WATCHTOWER_URL variable set, nothing to notify.'
            exit 0
          fi
          # The endpoint answers once it has pulled and recreated, so the
          # timeout is minutes. --fail turns a refused ping into a red check.
          answer=$(curl --fail --silent --show-error --max-time 300 \
            -X POST "$WATCHTOWER_URL" \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN:-}")
          printf 'Watchtower answered: %s\n' "$answer"
