<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>james</title>
<!-- The popup settings, written here by the server. -->
<script type="application/json" id="james-config">__JAMES_CONFIG__</script>
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<main id="app">
  <div id="messages" class="messages" role="log" aria-live="polite"></div>
  <p id="note" class="note" role="status" hidden></p>
  <form id="composer" class="composer" hidden>
    <div id="attachments" class="attachments" hidden></div>
    <div class="composer-row">
      <button type="button" id="attach" class="icon-button" title="">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </button>
      <textarea id="input" rows="1"></textarea>
      <button type="submit" id="send" class="icon-button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
      <button type="button" id="stop" class="icon-button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
      </button>
    </div>
    <div class="composer-row secondary">
      <button type="button" id="reset" class="link-button"></button>
    </div>
  </form>
  <input type="file" id="files" accept="image/*" multiple hidden>
  <dialog id="ask" class="ask">
    <form method="dialog">
      <p id="ask-text" class="ask-text"></p>
      <div class="ask-buttons">
        <button value="yes" id="ask-yes" class="icon-button ask-yes"></button>
        <button value="no" id="ask-no" class="icon-button"></button>
      </div>
    </form>
  </dialog>
</main>
<script src="static/vendor/marked.umd.js"></script>
<script src="static/vendor/purify.min.js"></script>
<script type="module" src="static/app.js"></script>
</body>
</html>
